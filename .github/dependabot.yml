version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 100
    ignore:
      # We want to use LTS versions of Wasmtime.
      - dependency-name: "wasmtime"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
